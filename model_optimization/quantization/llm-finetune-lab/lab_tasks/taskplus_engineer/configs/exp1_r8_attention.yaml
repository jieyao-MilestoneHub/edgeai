# Experiment 1: LoRA Rank 8, Attention Only
# 目標：測試最小參數配置的效果

# 繼承基礎配置，只覆寫需要修改的部分

# ==================== LoRA Configuration ====================
lora:
  rank: 8
  alpha: 16.0                          # 2 × rank
  dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:                      # 只訓練 Attention 層
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"

# ==================== Output Configuration ====================
output:
  dir: "output_task03_exp1_r8_attention"
  overwrite_output_dir: true
  logging_dir: "logs/exp1_r8_attention"
