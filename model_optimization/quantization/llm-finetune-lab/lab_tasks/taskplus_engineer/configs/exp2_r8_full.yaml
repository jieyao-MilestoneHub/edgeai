# Experiment 2: LoRA Rank 8, Attention + MLP
# 目標：測試 rank=8 時加入 MLP 的效果提升

lora:
  rank: 8
  alpha: 16.0
  dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:                      # Attention + MLP
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

output:
  dir: "output_task03_exp2_r8_full"
  overwrite_output_dir: true
  logging_dir: "logs/exp2_r8_full"
