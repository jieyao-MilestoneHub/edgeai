# Experiment 3: LoRA Rank 16, Attention Only
# 目標：測試中等參數配置，只訓練 Attention

lora:
  rank: 16
  alpha: 32.0
  dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:                      # 只訓練 Attention 層
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"

output:
  dir: "output_task03_exp3_r16_attention"
  overwrite_output_dir: true
  logging_dir: "logs/exp3_r16_attention"
