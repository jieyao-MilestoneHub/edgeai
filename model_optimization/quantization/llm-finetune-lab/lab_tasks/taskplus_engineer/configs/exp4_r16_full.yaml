# Experiment 4: LoRA Rank 16, Attention + MLP
# 目標：基準配置，平衡效果與效率

lora:
  rank: 16
  alpha: 32.0
  dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:                      # Attention + MLP
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

output:
  dir: "output_task03_exp4_r16_full"
  overwrite_output_dir: true
  logging_dir: "logs/exp4_r16_full"
