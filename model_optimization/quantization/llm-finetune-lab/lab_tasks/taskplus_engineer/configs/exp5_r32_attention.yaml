# Experiment 5: LoRA Rank 32, Attention Only
# 目標：測試高參數配置，只訓練 Attention

lora:
  rank: 32
  alpha: 64.0
  dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:                      # 只訓練 Attention 層
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"

output:
  dir: "output_task03_exp5_r32_attention"
  overwrite_output_dir: true
  logging_dir: "logs/exp5_r32_attention"
